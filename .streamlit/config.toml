# Configuración de Streamlit para el despliegue en Railway.
#
# websocketPingInterval: por defecto Streamlit NO manda pings de keep-alive
# (el default es None). Sin tráfico periódico, el proxy del borde de Railway
# corta la conexión que va del borde a la app, aunque la del navegador al
# borde siga viva. Streamlit interpreta eso como que el usuario se fue y
# aborta el render a mitad de camino (se verificó en producción: la cadena
# que detenía la corrida era disconnect_session -> request_script_stop, con
# el WebSocket del navegador todavía abierto). El síntoma para el usuario era
# el dashboard cargando para siempre, mostrando solo la primera sección, con
# el CPU del contenedor en 0%.
[server]
websocketPingInterval = 20
