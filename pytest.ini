[pytest]
# --strict-markers: una marca no declarada abajo (por ejemplo, un error de tipeo en «externa») hace fallar la
# recolección en vez de ignorarse en silencio. (P-2: el plugin pytester ya no se carga: creaba procesos hijos sin
# guardias. Los procesos hijos de las pruebas se crean solo por las dos vías de tests/_guardia_procesos.py.)
addopts = --strict-markers
markers =
    externa: necesita servicios externos reales (Yahoo Finance, Gemini u otras APIs); se omite salvo FRI_PRUEBAS_EXTERNAS=1
    simulada: usa conexiones o servicios simulados (mocks, funciones falsas, destinos ficticios)
    integracion_bd: necesita la base PostgreSQL local de pruebas (decide el registro de tests/conftest.py)
    intentos_de_red_esperados: provoca a propósito intentos de red bloqueados (solo las pruebas del guardia de red)
